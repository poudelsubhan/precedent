              "DATA_DIR": "/data",
              "RANGE_READ_TOKEN": "${RANGE_READ_TOKEN}",
              "WORKER_ID": "payment-worker-a",
              "WORKLOAD_SECRET": "${WORKER_A_SECRET}",
            },
